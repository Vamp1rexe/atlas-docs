<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B58BFF"/><stop offset="1" stop-color="#7FD3FF"/>
    </linearGradient>
    <linearGradient id="main" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#A57CFF"/><stop offset="0.55" stop-color="#6FA8FF"/><stop offset="1" stop-color="#3EDCFF"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0.6" x2="1" y2="0.4">
      <stop offset="0" stop-color="#A57CFF"/><stop offset="1" stop-color="#5BC8FF"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1B1838"/><stop offset="1" stop-color="#0E0D20"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="512" cy="512" r="482" fill="url(#bg)" stroke="url(#rim)" stroke-width="14"/>

  <!-- faint globe -->
  <g fill="none" stroke="#3A3A78" stroke-width="5" opacity="0.8">
    <circle cx="512" cy="512" r="340"/>
    <ellipse cx="512" cy="512" rx="340" ry="118"/>
    <ellipse cx="512" cy="512" rx="170" ry="340"/>
  </g>

  <!-- A -->
  <g filter="url(#glow)" stroke="url(#main)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M300 760 L512 238 L724 760"/>
  </g>

  <!-- orbit ring + dot -->
  <g filter="url(#glow)">
    <ellipse cx="512" cy="590" rx="300" ry="72" transform="rotate(-9 512 590)" fill="none" stroke="url(#orbit)" stroke-width="24"/>
    <circle cx="797" cy="522" r="26" fill="#3EDCFF"/>
  </g>


</svg>